# Netlify: front estático; el API corre en Railway. El orden importa: /api antes que el fallback SPA.
#
# Subdominio Startup Day (mismo deploy; el front elige la landing por hostname):
#   1. Domain management → Add domain alias: startupday.xploraucema.com
#   2. DNS: CNAME `startupday` → target que indique Netlify (ej. <site>.netlify.app)
#   3. SSL automático vía Netlify

[build]
  publish = "dist"
  command = "npm run build"

# Misma URL que Railway → public networking (sin / final). Así /api/* en xploraucema.com llega al Node
# aunque el bundle no tenga VITE_API_ORIGIN (el .env local no viaja con git).
[[redirects]]
  from = "/api/*"
  to = "https://xplora-production.up.railway.app/api/:splat"
  status = 200
  force = true

# El recap tiene metadatos disponibles sin JavaScript para previews al compartir.
# Regla exacta de host + raíz: no intercepta imágenes, bundles ni el API.
[[redirects]]
  from = "https://startupday.xploraucema.com/"
  to = "/startup-day.html"
  status = 200
  force = true

# SPA: rutas del sitio + la URL secreta del panel (VITE_PANEL_PATH en build).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
